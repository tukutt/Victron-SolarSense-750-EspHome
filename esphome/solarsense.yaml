# ESPHome configuration — SolarSense 750 BLE decoder + Bluetooth proxy
#
# Decodes the Victron SolarSense 750 Instant Readout advertisements locally
# and exposes them as native ESPHome entities to Home Assistant. The ESP32
# also acts as an active Bluetooth proxy for any other BLE device HA
# supports natively.
#
# Required secrets in secrets.yaml:
#   wifi_ssid:        "your-ssid"
#   wifi_password:    "your-password"
#   solarsense_mac:   "AA:BB:CC:DD:EE:FF"   # MAC of your SolarSense 750

substitutions:
  solarsense_mac: !secret solarsense_mac

esphome:
  name: "esphome-ble-proxy"
  friendly_name: BLE Proxy
  min_version: 2026.4.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:

mqtt:
  broker: 10.0.0.128       # IP de ton broker Mosquitto (celui de HA)
  port: 1883
  username: !secret mqtt_user    # si ton broker en demande
  password: !secret mqtt_pass
  #topic_prefix: solarsense   # topics propres et stables, indépendants du nom du node
  discovery: false           # IMPORTANT : sinon tu auras les capteurs en DOUBLE dans HA
                             # (une fois via l'API native, une fois via MQTT discovery)

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# --- BLE -----------------------------------------------------------------

esp32_ble_tracker:
  scan_parameters:
    # The SolarSense broadcasts ~1 Hz; passive scan is enough.
    active: false
    interval: 1100ms
    window: 1100ms
  on_ble_advertise:
    - mac_address: ${solarsense_mac}
      then:
        - lambda: |-
            // Decodes the Victron Solar Sense bit-packed record (24-byte
            // manufacturer advertisement, manufacturer id 0x02E1). Layout
            // and scaling match the Victron reference implementation:
            //   https://github.com/victronenergy/dbus-ble-sensors/blob/master/src/solarsense.c
            for (auto md : x.get_manufacturer_datas()) {
              if (md.uuid.get_uuid().uuid.uuid16 != 0x02E1) continue;
              const auto& d = md.data;
              // Validate protocol magic bytes per Victron source
              if (d.size() < 24 || d[0] != 0x10 || d[4] != 0xFF || d[7] != 0x01)
                continue;

              uint32_t error_code   = (uint32_t)d[8]
                                    | ((uint32_t)d[9]  << 8)
                                    | ((uint32_t)d[10] << 16)
                                    | ((uint32_t)d[11] << 24);
              uint8_t  charger_err  = d[12];
              uint32_t pv_power_raw = (uint32_t)d[13]
                                    | ((uint32_t)d[14] << 8)
                                    | (((uint32_t)d[15] & 0x0F) << 16);
              uint32_t yield_raw    = ((uint32_t)d[15] >> 4)
                                    | ((uint32_t)d[16] << 4)
                                    | ((uint32_t)d[17] << 12);
              uint16_t irr_raw      = (uint16_t)d[18]
                                    | (((uint16_t)d[19] & 0x3F) << 8);
              uint16_t temp_raw     = ((uint16_t)d[19] >> 6)
                                    | ((uint16_t)d[20] << 2)
                                    | (((uint16_t)d[21] & 0x01) << 10);
              uint8_t  bat_raw      = (d[21] >> 2) | ((d[22] & 0x03) << 6);
              uint8_t  tss_raw      = (d[22] >> 3) | ((d[23] & 0x03) << 5);

              char ec[16];
              snprintf(ec, sizeof(ec), "0x%08X", error_code);
              id(ss_error_code).publish_state(std::string(ec));

              if (charger_err != 0xFF) {
                char ce[8];
                snprintf(ce, sizeof(ce), "0x%02X", charger_err);
                id(ss_charger_error).publish_state(std::string(ce));
              }

              if (pv_power_raw != 0xFFFFF)
                id(ss_installation_power).publish_state((float)pv_power_raw);
              if (yield_raw != 0xFFFFF)
                id(ss_yield).publish_state((float)yield_raw * 0.01f);
              if (irr_raw != 0x3FFF)
                id(ss_irradiance).publish_state((float)irr_raw * 0.1f);
              if (temp_raw != 0x7FF)
                id(ss_cell_temp).publish_state((float)temp_raw * 0.1f - 60.0f);
              if (bat_raw != 0xFF)
                id(ss_battery).publish_state(1.70f + (float)bat_raw * 0.01f);

              if (tss_raw != 0x7F) {
                uint16_t minutes;
                if (tss_raw <= 29)        minutes = tss_raw * 2;
                else if (tss_raw <= 95)   minutes = 60 + 10 * (tss_raw - 30);
                else if (tss_raw <= 126)  minutes = 720 + 30 * (tss_raw - 96);
                else                      minutes = tss_raw;
                id(ss_since_sun).publish_state((float)minutes);
              }
            }

# Forwards every other BLE advertisement to Home Assistant so this ESP32
# also serves as a regular Bluetooth proxy for natively supported devices
# (Xiaomi, Govee, Switchbot, official Victron, etc.).
bluetooth_proxy:
  active: true

# --- Entities exposed to Home Assistant ----------------------------------

sensor:
  - platform: template
    name: "SolarSense Irradiance"
    id: ss_irradiance
    unit_of_measurement: "W/m²"
    accuracy_decimals: 1
    state_class: measurement
    icon: mdi:weather-sunny

  - platform: template
    name: "SolarSense Installation Power"
    id: ss_installation_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement

  - platform: template
    name: "SolarSense Today's Yield"
    id: ss_yield
    unit_of_measurement: "kWh"
    accuracy_decimals: 2
    device_class: energy
    state_class: total_increasing

  - platform: template
    name: "SolarSense Cell Temperature"
    id: ss_cell_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement

  - platform: template
    name: "SolarSense Battery Voltage"
    id: ss_battery
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement

  - platform: template
    name: "SolarSense Time Since Last Sun"
    id: ss_since_sun
    unit_of_measurement: "min"
    accuracy_decimals: 0
    icon: mdi:weather-night
    # Quantisation is non-linear (2 min steps then 10 min then 30 min)
    # so the unit is minutes but values jump in larger increments.

text_sensor:
  - platform: template
    name: "SolarSense Error Code"
    id: ss_error_code
    icon: mdi:alert-circle-outline

  - platform: template
    name: "SolarSense Charger Error"
    id: ss_charger_error
    icon: mdi:alert-circle-outline

binary_sensor:
  - platform: template
    name: "Low Battery"
    id: ss_low_battery
    device_class: problem
    lambda: |-
      // Victron's official LowBattery alarm: trip below 3.2 V,
      // release above 3.6 V (0.4 V hysteresis).
      static bool low = false;
      float v = id(ss_battery).state;
      if (isnan(v)) return low;
      if (v < 3.2) low = true;
      else if (v > 3.6) low = false;
      return low;